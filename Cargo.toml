[package]
name = "awayra"
version = "1.0.0"
edition = "2021"
description = "A calm break reminder for healthier computer use — Linux port"
authors = ["Farzin Alavi"]
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
gtk4 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs"] }
directories = "6"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.18", default-features = false, features = ["symphonia-all"] }
ksni = "0.2"
x11rb = { version = "0.14", features = ["screensaver", "image"] }
ashpd = { version = "0.13", features = ["screenshot"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true