[package]
name = "awayra"
version = "1.0.0"
edition = "2021"
description = "A calm break reminder for healthier computer use — Linux port"
authors = ["Farzin Alavi"]
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
gtk4 = { version = "0.11", features = ["unsafe-assume-initialized"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs"] }
directories = "6"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.18", default-features = false, features = ["symphonia-all"] }
tray-icon = { version = "0.14", default-features = false }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true